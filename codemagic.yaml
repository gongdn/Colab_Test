workflows:
  ios-testflight:
    name: WBM Trainer DualCam - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: wbm_app_store_connect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.wbmtrainer.dualcam
      vars:
        BUNDLE_ID: "org.wbmtrainer.dualcam"
        XCODE_PROJECT: "WBMTrainerDualCam/WBMTrainerDualCam.xcodeproj"
        XCODE_SCHEME: "WBMTrainerDualCam"
      xcode: latest

    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen
          cd "$CM_BUILD_DIR/WBMTrainerDualCam"
          xcodegen generate

      - name: Apply signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Set build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-1}" WBMTrainerDualCam/Info.plist

      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
